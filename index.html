<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriVision AI - Demo</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f8fa;
        text-align: center;
        padding: 30px;
    }
    h1 {
        color: #2e7d32;
    }
    .container {
        background: #fff;
        max-width: 500px;
        margin: auto;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input[type="file"] {
        margin: 15px 0;
    }
    .result {
        margin-top: 20px;
        padding: 15px;
        background: #e8f5e9;
        border-radius: 8px;
        text-align: left;
    }
    button {
        background: #2e7d32;
        color: #fff;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    button:hover {
        background: #1b5e20;
    }
</style>
</head>
<body>
    <h1>AgriVision AI</h1>
    <div class="container">
        <h3>Upload Crop Image</h3>
        <input type="file" id="imageUpload">
        <br>
        <button onclick="showResult()">Analyze</button>
        <div class="result" id="result" style="display:none;">
            <h4>Analysis Result:</h4>
            <p><strong>Crop:</strong> Wheat</p>
            <p><strong>Health:</strong> Good</p>
            <p><strong>Advice:</strong> Apply 20kg NPK fertilizer and water moderately this week.</p>
        </div>
    </div>

<script>
function showResult() {
    document.getElementById('result').style.display = 'block';
}
</script>
</body>
</html>
